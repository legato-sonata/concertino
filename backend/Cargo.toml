[package]
name = "concertino-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
solana-client = "1.17"
solana-sdk = "1.17"
solana-program = "1.17"
spl-associated-token-account = "1.1"
spl-token = "3.3"
anchor-client = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"
